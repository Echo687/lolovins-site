<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lolo Vins — natural wine</title>
<meta name="description" content="Natural wine from small French growers. Nothing added, just grapes. For your table, your bar or your restaurant. New website coming soon.">
<meta name="theme-color" content="#163531">
<link rel="icon" href="img/Lolo_logo_wit.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#163531;color:#fdfcf9;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:40px 24px;text-align:center}
.logo{width:150px;height:auto;animation:logoIn 1.1s ease both, logoUp .9s cubic-bezier(.6,0,.2,1) 1.6s both}
.text{margin-top:38px;max-width:360px;opacity:0;animation:in .9s ease 2.3s both}
h1{font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:17px;margin-bottom:12px}
p{color:rgba(253,252,249,.75)}
.links{margin-top:26px;display:flex;flex-direction:column;gap:6px}
a{color:#fdfcf9;text-decoration:none;border-bottom:1px solid rgba(253,252,249,.35);align-self:center}
a:hover{border-color:#fdfcf9}
.small{position:fixed;bottom:18px;left:0;right:0;font-size:13px;color:rgba(253,252,249,.5);opacity:0;animation:in .9s ease 2.6s both}
@keyframes logoIn{from{opacity:0;transform:translateY(90px) scale(1.25)}to{opacity:1;transform:translateY(90px) scale(1.25)}}
@keyframes logoUp{from{transform:translateY(90px) scale(1.25)}to{transform:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
  <img class="logo" src="img/Lolo_logo_wit.svg" alt="Lolo Vins">
  <div class="text">
    <h1>New website coming soon</h1>
    <p>Natural wine from small French growers. Nothing added, just grapes. For your table, your bar or your restaurant.</p>
        <div class="links">
      <a href="mailto:info@lolovins.nl">info@lolovins.nl</a>
      <a href="https://wa.me/31617003630">06 17 00 36 30</a>
    </div>
  </div>
  <div class="small">Lolo Vins · No alcohol under 18</div>
</body>
</html>
